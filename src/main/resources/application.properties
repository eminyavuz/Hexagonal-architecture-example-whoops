spring.application.name=whoops

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/whoops
spring.datasource.username=whoops
spring.datasource.password=whoops

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=whoops
spring.rabbitmq.password=whoops

# RabbitMQ Listener Retry Configuration

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=5s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=20s
spring.rabbitmq.listener.simple.retry.stateless=true