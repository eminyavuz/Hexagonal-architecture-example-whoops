services:
  postgres:
    image: postgres:17
    container_name: whoops-postgres
    environment:
      POSTGRES_DB: whoops
      POSTGRES_USER: whoops
      POSTGRES_PASSWORD: whoops
    ports:
      - "5432:5432"
    volumes:
      - whoops_postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: whoops-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: whoops
      RABBITMQ_DEFAULT_PASS: whoops
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  whoops_postgres_data: